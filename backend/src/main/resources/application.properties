spring.application.name=TimeAway
spring.datasource.url=jdbc:mysql://localhost:3306/timeaway?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=root


app.cors.origin=${APP_CORS_ORIGIN}
# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================
# "update" = Automatically create/update tables to match your Java code.
# WARNING: Use 'validate' or 'none' in production!
spring.jpa.hibernate.ddl-auto=update

# Show SQL in the console (Great for debugging)
spring.jpa.show-sql=false

# Format the SQL so it's readable
spring.jpa.properties.hibernate.format_sql=true

# The SQL Dialect (Optional in newer Spring Boot, but good to be explicit)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

security.jwt.secret-key=b35c073d1c8b8ab5d5133ad219b08e655dd448dae19a1c289e5242f498ab39df
security.jwt.expiration-time=360000000

# Use Gmail's servers even for your .ma company email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL}
# The 16-digit App Password you generated
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
